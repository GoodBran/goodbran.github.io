<footer class="site-footer">
  <div class="container">
    <div class="footer-content">
      <a href="{{ "/" | relative_url }}" class="footer-brand">
        {% include logo.html class="footer-logo" size=24 %}
        <span>~/{{ site.title | downcase | escape }}</span>
      </a>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="{{ "/blog/" | relative_url }}">blog/</a>
        <a href="{{ "/projects/" | relative_url }}">projects/</a>
        <a href="{{ "/about/" | relative_url }}">about/</a>
        <a href="{{ "/feed.xml" | relative_url }}">rss</a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">github</a>
      </nav>
    </div>
    <div class="footer-bottom">
      <p><span class="eof">EOF</span>&copy; {{ site.time | date: "%Y" }} {{ site.title | escape }} · built with <a href="https://jekyllrb.com">jekyll</a></p>
    </div>
  </div>
</footer>
