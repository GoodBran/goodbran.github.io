---
layout: default
---

<article class="article page-article">
  <header class="article-header">
    <p class="article-path">~/{{ page.title | downcase | escape }}.md</p>
    <h1 class="article-title">{{ page.title | escape }}</h1>
  </header>

  <div class="article-content">
    {{ content }}
  </div>
</article>
