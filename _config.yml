# Site settings
title: Goodbran
tagline: Notes on code, music, and making things.
email: bran.liang@icloud.com
description: >-
  Writing, publishing, and sharing notes.
  A personal blog about coding, music, and creativity.
# URL settings
# goodbran.com is the canonical address; goodbran.github.io serves a copy
# whose canonical links and feed point here.
url: "https://goodbran.com"
baseurl: ""

# Social
twitter_username: goodbran
github_username: goodbran

# Build settings
# No gem theme - using custom Protocol-inspired theme
theme: null
plugins:
  - jekyll-feed



# Markdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# Files Jekyll would otherwise skip because of the leading underscore
include:
  - _redirects

# Exclusions
exclude:
  - cloudflare.config.ts
  - package.json
  - package-lock.json
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - "*.gemspec"
